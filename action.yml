name: "GIPHY PR comment"
description: "Add a GIPHY GIF comment to new PULL Requests"

inputs:
  github-token:
    description: "GitHub TOken"
    required: true
  giphy-api-key:
    description: "GIPHY API Key"
    required: true

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.github-token }}
    - ${{ inputs.giphy-api-key }}